name: Release
run-name: Release ${{ inputs.tag }} ${{ github.actor }} ${{ github.event_name }}

on:
  workflow_call:
    inputs:
      tag:
        description: "The tag to release (v1.0.0-beta, v1.0.0)"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release (v1.0.0-beta, v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  get-configs:
    uses: ./.github/workflows/configs.yml

  version-and-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.validate-tag.outputs.tag }}
      is-prerelease: ${{ steps.validate-tag.outputs.is-prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-tags: true

      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate tag matches version
        id: validate-tag
        run: |
          VERSION=${{ steps.get-version.outputs.version }}
          TAG=${{ inputs.tag }}
          
          if [[ "$TAG" == "v$VERSION" ]]; then
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^v$VERSION-beta$ ]]; then
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "Error: Tag ($TAG) must be v$VERSION or v$VERSION-beta"
            exit 1
          fi

  build-and-test:
    needs: [ get-configs, version-and-tag ]
    permissions:
      contents: read
      code-quality: write
    uses: ./.github/workflows/build-and-test.yml
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    with:
      ref: ${{ needs.version-and-tag.outputs.tag }}
      runs-on: ${{ matrix.os }}

  bundle-linux-legacy:
    needs: [ get-configs, version-and-tag, build-and-test ]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: "x64", docker-platform: "linux/amd64", go-arch: "amd64", use_qemu: false, node-version: "18" }
          - { arch: "arm64", docker-platform: "linux/arm64", go-arch: "arm64", use_qemu: true, node-version: "18" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-and-tag.outputs.tag }}
          fetch-tags: true

      - name: Set release asset name
        id: set-asset-name
        shell: bash
        run: |
          APP_NAME=${{ needs.get-configs.outputs.app-name }}
          VERSION=$(node -p "require('./package.json').version")
          NODE_VERSION=${{ matrix.node-version }}
          NODE_MAJOR=$(echo $NODE_VERSION | cut -d. -f1)

          TAG=${{ needs.version-and-tag.outputs.tag }}
          if [[ "$TAG" =~ -beta$ ]]; then
            FILE_NAME="${APP_NAME}-${VERSION}-beta-linuxglib2.28-${{ matrix.arch }}-node${NODE_MAJOR}"
          else
            FILE_NAME="${APP_NAME}-${VERSION}-linuxglib2.28-${{ matrix.arch }}-node${NODE_MAJOR}"
          fi

          ASSET_NAME=$(echo "$FILE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "ASSET_NAME=${ASSET_NAME}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: matrix.use_qemu
        uses: docker/setup-qemu-action@v4

      - name: Bundle (${{ matrix.docker-platform }}-${{ matrix.node-version }})
        run: |
          docker run --rm -t -v ${{ github.workspace }}:/work -w /work \
            --platform ${{ matrix.docker-platform }} \
            node:18-buster \
            /bin/bash -c '
              set -e

              git config --global --add safe.directory /work
              echo "deb http://archive.debian.org/debian buster main" > /etc/apt/sources.list
              echo "deb http://archive.debian.org/debian-security buster/updates main" >> /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false update

              apt-get update
              apt-get install -y make g++ python3 python3-pip build-essential tar gzip wget tree
              wget -q https://bootstrap.pypa.io/pip/3.7/get-pip.py && python3 get-pip.py

              SYS_LIB=$(find /usr/lib -name libstdc++.so.6 | head -n 1)
              SYS_MAX=$(strings "$SYS_LIB" | grep "GLIBCXX_[0-9]" | sort -V | tail -n 1)
              SYS_MIN=$(strings "$SYS_LIB" | grep "GLIBCXX_[0-9]" | sort -V | head -n 1)
              echo "----------------------------------------------------------------"
              echo "SYSTEM BASELINE:"
              echo "Library Path: $SYS_LIB"
              echo "Max GLIBCXX Supported: $SYS_MAX"
              echo "Min GLIBCXX Supported: $SYS_MIN"
              echo "----------------------------------------------------------------"

              wget -q https://go.dev/dl/go${{ needs.get-configs.outputs.go-version }}.linux-${{ matrix.go-arch }}.tar.gz
              tar -C /usr/local -xzf go${{ needs.get-configs.outputs.go-version }}.linux-${{ matrix.go-arch }}.tar.gz
              export PATH=$PATH:/usr/local/go/bin

              uname -r && node -v && npm -v && go version

              npm ci

              TAG="${{ needs.version-and-tag.outputs.tag }}"
              if [[ "$TAG" =~ -beta$ ]]; then
                npm run bundle:beta -- --env rebuild=true --env buildTarget=legacy
              else
                npm run bundle:prod -- --env rebuild=true --env buildTarget=legacy
              fi

              if [ -z "$(find . -name "*.node" -print -quit)" ]; then
                 echo "::warning::No .node files found to check"
                 exit 1
              else
                 find . -name "*.node" -print0 | while IFS= read -r -d "" file; do
                    echo "Inspecting: $file"
                    FILE_MAX=$(strings "$file" | grep "GLIBCXX_[0-9]" | sort -V | tail -n 1)
                    FILE_MIN=$(strings "$file" | grep "GLIBCXX_[0-9]" | sort -V | head -n 1)
                    echo "  > FileMAX - $FILE_MAX FileMIN - $FILE_MIN"
                 done
              fi

              GOARCH=${{ matrix.go-arch }} go build -C ./cfn-init/cmd -v -o ../../bundle/production/bin/cfn-init
              cp ./cfn-init/THIRD-PARTY-LICENSES.txt ./bundle/production/bin/
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.set-asset-name.outputs.ASSET_NAME }}
          path: bundle/production/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          retention-days: 1

  bundle:
    needs: [ get-configs, version-and-tag, build-and-test ]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: "ubuntu-latest", arch: "x64", platform: "linux", go-arch: "amd64", node-version: "24.x" }
          - { os: "ubuntu-24.04-arm", arch: "arm64", platform: "linux", go-arch: "arm64", node-version: "24.x" }
          - { os: "macos-15-intel", arch: "x64", platform: "darwin", go-arch: "amd64", node-version: "24.x" }
          - { os: "macos-latest", arch: "arm64", platform: "darwin", go-arch: "arm64", node-version: "24.x" }
          - { os: "windows-latest", arch: "x64", platform: "win32", go-arch: "amd64", node-version: "24.x" }
          - { os: "windows-11-arm", arch: "arm64", platform: "win32", go-arch: "arm64", node-version: "24.x" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-and-tag.outputs.tag }}
          fetch-tags: true

      - name: Git Status
        shell: bash
        run: echo "Bundling from branch=$(git rev-parse --abbrev-ref HEAD), commit=$(git rev-parse HEAD), tag=$(git describe --tags --exact-match)"

      - name: Setup Node.js ${{ matrix.node-version }} (${{ runner.os }})
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Go ${{ needs.get-configs.outputs.go-version }} (${{ runner.os }})
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.get-configs.outputs.go-version }}
          cache-dependency-path: cfn-init/go.sum

      - name: Install Dependencies
        run: npm ci

      - name: Bundle (${{ matrix.os }}-${{ matrix.node-version }})
        shell: bash
        run: |
          TAG=${{ needs.version-and-tag.outputs.tag }}
          if [[ "$TAG" =~ -beta$ ]]; then
            npm run bundle:beta
          else
            npm run bundle:prod
          fi

      - name: Bundle Go
        shell: bash
        env:
          GOPROXY: direct
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            GOARCH=${{ matrix.go-arch }} go build -C ./cfn-init/cmd -v -o ../../bundle/production/bin/cfn-init.exe
          else
            GOARCH=${{ matrix.go-arch }} go build -C ./cfn-init/cmd -v -o ../../bundle/production/bin/cfn-init
          fi
          cp ./cfn-init/THIRD-PARTY-LICENSES.txt ./bundle/production/bin/

      - name: Set release asset name
        id: set-asset-name
        shell: bash
        run: |
          APP_NAME=${{ needs.get-configs.outputs.app-name }}
          VERSION=$(node -p "require('./package.json').version")
          PLATFORM=${{ matrix.platform }}
          ARCH=${{ matrix.arch }}
          NODE_VERSION=${{ matrix.node-version }}
          NODE_MAJOR=$(echo $NODE_VERSION | cut -d. -f1)
          
          TAG=${{ needs.version-and-tag.outputs.tag }}
          if [[ "$TAG" =~ -beta$ ]]; then
            FILE_NAME="${APP_NAME}-${VERSION}-beta-${PLATFORM}-${ARCH}-node${NODE_MAJOR}"
          else
            FILE_NAME="${APP_NAME}-${VERSION}-${PLATFORM}-${ARCH}-node${NODE_MAJOR}"
          fi
          
          ASSET_NAME=$(echo "$FILE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "ASSET_NAME=${ASSET_NAME}"
          echo "ASSET_NAME=${ASSET_NAME}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.set-asset-name.outputs.ASSET_NAME }}
          path: bundle/production/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          retention-days: 1

  release:
    needs: [ version-and-tag, bundle-linux-legacy, bundle ]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          extract: false

      - name: Create zip files for release
        run: |
          ls -R artifacts/
          
          cd artifacts
          for dir in */; do
            dirname="${dir%/}"
            echo "Creating ${dirname}.zip"
            (cd "$dirname" && zip -r "../${dirname}.zip" .)
            rm -rf "$dirname"
          done
          ls -lh *.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.SIGNING_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sign artifacts with KMS
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          KMS_KEY_ALIAS: ${{ secrets.KMS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in artifacts/*; do
            rm -f digest.bin
            openssl dgst -sha256 -binary "$f" > digest.bin

            aws kms sign \
              --region "$AWS_REGION" \
              --key-id "$KMS_KEY_ALIAS" \
              --message fileb://digest.bin \
              --message-type DIGEST \
              --signing-algorithm RSASSA_PKCS1_V1_5_SHA_256 \
              --query Signature --output text | base64 -d > "$f.sig"

            echo "signed: $f -> $f.sig"
          done
          rm -f digest.bin

      - name: Verify signatures
        env:
          SIGNING_PUBLIC_KEY: ${{ secrets.SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          printf '%s\n' "$SIGNING_PUBLIC_KEY" > signing-key.pem

          for f in artifacts/*; do
            case "$f" in *.sig) continue ;; esac
            echo "Verifying: $f"
            result=$(openssl dgst -sha256 -verify signing-key.pem -signature "$f.sig" "$f") || true
            echo "$result"
            if [ "$result" != "Verified OK" ]; then
              echo "::error::signature verification failed for $f"
              exit 1
            fi
          done
          rm -f signing-key.pem

      - name: Add public key to release assets
        env:
          SIGNING_PUBLIC_KEY: ${{ secrets.SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SIGNING_PUBLIC_KEY" > artifacts/signing-key.pem
          fingerprint=$(openssl pkey -pubin -in artifacts/signing-key.pem -outform DER | openssl dgst -sha256 | awk '{print $NF}')
          printf '%s\n' "$fingerprint" > artifacts/signing-key.pem.sha256
          echo "public key SHA-256: $fingerprint"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version-and-tag.outputs.tag }}
          prerelease: ${{ needs.version-and-tag.outputs.is-prerelease }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  long-running-tests:
    needs: [version-and-tag, release]
    uses: ./.github/workflows/post-release-long-running.yml
    with:
      tag: ${{ needs.version-and-tag.outputs.tag }}

  update-release-manifest:
    needs: [version-and-tag, release, long-running-tests]
    uses: ./.github/workflows/update-release-manifest.yml
    permissions:
      contents: write
      pull-requests: write
